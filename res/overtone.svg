  <!-- The harmonic diagram, kept from the original art at its 72 dpi scale: the
       LEDs joined in a row, the even / odd / all rows of harmonic boxes, and the
       leads from them down to the two jacks. The leads were mirrored here so the
       one from the LED row reaches MASK, which is the LEFT jack in the widget
       (the old art had MASK and FILTER the other way round). The numbers in the
       boxes, labels, title and the switch link are drawn by the widget
       (sfs::PanelLabels); screen, plate and logo by tools/panel_reticules.py. -->
